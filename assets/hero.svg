<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><title>Sudalai Manikandan S - IT Professional - Software Developer, AI &amp; Machine Learning Engineer - Python, React, Node.js, Django</title><desc>Anime manga-style profile banner for Sudalai Manikandan S from Tenkasi, Tamil Nadu, India. IT professional and software developer working across web development, machine learning, data engineering and automation with Python, React, Node.js, Django, OpenCV, YOLO, NLTK and scikit-learn.</desc><defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3ec"/><stop offset="0.5" stop-color="#ffe9fb"/><stop offset="1" stop-color="#e9f4ff"/></linearGradient>
<linearGradient id="popText" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff2392"/><stop offset="0.5" stop-color="#ff6b3d"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.4" fill="#ff6b3d" opacity="0.35"/><circle cx="10" cy="10" r="2.4" fill="#ff6b3d" opacity="0.35"/></pattern>
<pattern id="dotsSmall" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#38b6ff" opacity="0.3"/><circle cx="6.5" cy="6.5" r="1.5" fill="#38b6ff" opacity="0.3"/></pattern>
<filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b2f" flood-opacity="0.9"/></filter>
</defs>
