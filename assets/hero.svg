<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><defs>
<linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00f0ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2e97"/></linearGradient>
<linearGradient id="cyberH" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f0ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2e97"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00f0ff" stop-opacity="0.0"/><stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.35"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0.0"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.45" r="0.6"><stop stop-color="#0b1030" stop-opacity="1"/><stop offset="1" stop-color="#05060f" stop-opacity="1"/></radialGradient>
<filter id="neon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="neonS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="380" rx="20" fill="#05060f"/>
<rect width="1000" height="380" rx="20" fill="url(#glow)"/>
<!-- grid -->
<path d="M0 60 H1000 M0 120 H1000 M0 180 H1000 M0 240 H1000 M0 300 H1000" stroke="#00f0ff" stroke-opacity="0.05" fill="none"/>
<path d="M80 0 V380 M180 0 V380 M280 0 V380 M380 0 V380 M480 0 V380 M580 0 V380 M680 0 V380 M780 0 V380 M880 0 V380 M980 0 V380" stroke="#00f0ff" stroke-opacity="0.05" fill="none"/>
<!-- animated frame -->
<rect x="1" y="1" width="998" height="378" rx="19" fill="none" stroke="url(#cyber)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="18 26"><animate attributeName="stroke-dashoffset" values="0;-88" dur="6s" repeatCount="indefinite"/></rect>
<!-- corner brackets -->
<path d="M22 34 H60 V60" stroke="url(#cyber)" stroke-width="3" fill="none"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></path>
<!-- matrix rain, right side -->
<g font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#00f0ff">
<text x="690" y="-20">1011000110</text><animate attributeName="opacity" values="0.5;0.9;0" dur="4s" repeatCount="indefinite"/>
<text x="735" y="-90">0100101101</text><animate attributeName="opacity" values="0.5;0.9;0" dur="5s" repeatCount="indefinite"/>
<text x="780" y="-160">1101010011</text><animate attributeName="opacity" values="0.5;0.9;0" dur="6s" repeatCount="indefinite"/>
<text x="825" y="-40">0011010110</text><animate attributeName="opacity" values="0.5;0.9;0" dur="4.5s" repeatCount="indefinite"/>
<text x="870" y="-120">1010110001</text><animate attributeName="opacity" values="0.5;0.9;0" dur="5.5s" repeatCount="indefinite"/>
<text x="915" y="-200">0110101100</text><animate attributeName="opacity" values="0.5;0.9;0" dur="6.5s" repeatCount="indefinite"/>
<text x="960" y="-80">1001101001</text><animate attributeName="opacity" values="0.5;0.9;0" dur="4.8s" repeatCount="indefinite"/>
</g>
<!-- sweeping scanline -->
<rect x="-20" y="0" width="3" height="380" fill="url(#scan)"><animate attributeName="x" values="-40;1040;-40" dur="7s" repeatCount="indefinite"/></rect>
<!-- status line -->
<text x="42" y="40" fill="#00f0ff" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="4" filter="url(#neonS)">CRACKYYYTECH :: DEVELOPER PROFILE</text>
<rect x="344" y="26" width="9" height="16" fill="#00f0ff"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
<!-- name -->
<text x="42" y="128" fill="#f7fbff" font-family="Consolas, monospace" font-size="50" font-weight="800" letter-spacing="1">SUDALAI</text>
<text x="42" y="188" fill="url(#cyberH)" font-family="Consolas, monospace" font-size="50" font-weight="800" letter-spacing="1" filter="url(#neonS)">MANIKANDAN S</text>
<!-- rotating roles -->
<g font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#a855f7">
<text x="44" y="236">AI ENGINEER  /  FULL-STACK SOFTWARE ENGINEER<animate attributeName="opacity" values="1;0;0;0;0;0" dur="6s" repeatCount="indefinite"/></text>
<text x="44" y="236">PYTHON  /  PHP  /  REACT  /  VBNET / SQL<animate attributeName="opacity" values="0;1;0;0;0;0" dur="6s" repeatCount="indefinite"/></text>
<text x="44" y="236">BILLING  /  VISION  /  TRANSLATION  /  AUTOMATION<animate attributeName="opacity" values="0;0;1;0;0;0" dur="6s" repeatCount="indefinite"/></text>
<text x="44" y="236">BUILDING PRACTICAL AI AND USEFUL APPS<animate attributeName="opacity" values="0;0;0;1;0;0" dur="6s" repeatCount="indefinite"/></text>
<text x="44" y="236">VISTAWIN  /  TECHNNEST  /  TRICHY ENG<animate attributeName="opacity" values="0;0;0;0;1;0" dur="6s" repeatCount="indefinite"/></text>
<text x="44" y="236">EXPLORE PROJECTS BELOW<animate attributeName="opacity" values="0;0;0;0;0;1" dur="6s" repeatCount="indefinite"/></text>
</g>
<!-- terminal prompt -->
<text x="44" y="300" fill="#7f8cb8" font-family="Consolas, monospace" font-size="16">$ python deploy_profile.py --theme=cyber</text>
<rect x="412" y="286" width="10" height="21" fill="#00ff9f"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
<text x="44" y="336" fill="#00ff9f" font-family="Consolas, monospace" font-size="13" font-weight="700">ACCESS GRANTED</text>
<!-- status LEDs -->
<circle cx="220" cy="330" r="3" fill="#ff2e97"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="230" y="334" fill="#ff2e97" font-family="Consolas, monospace" font-size="12">SYS</text>
<circle cx="290" cy="330" r="3" fill="#ffc568"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
<text x="300" y="334" fill="#ffc568" font-family="Consolas, monospace" font-size="12">NET</text>
<circle cx="360" cy="330" r="3" fill="#00ff9f"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
<text x="370" y="334" fill="#00ff9f" font-family="Consolas, monospace" font-size="12">OPEN_TO_WORK</text>
</svg>