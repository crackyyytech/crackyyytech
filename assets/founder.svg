<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Sudalai Manikandan S is the founder and owner of CRACKYYY.TECH">
  <title>Sudalai Manikandan S - Founder &amp; Owner of CRACKYYY.TECH</title>
  <desc>Founder badge: Sudalai Manikandan S is the founder and owner of CRACKYYY.TECH, a software development, AI/ML, data and automation brand from Tenkasi, Tamil Nadu, India.</desc>
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1b2f"/><stop offset="1" stop-color="#2c2350"/></linearGradient>
    <linearGradient id="fAccent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff2392"/><stop offset="0.5" stop-color="#ff6b3d"/><stop offset="1" stop-color="#ffc800"/></linearGradient>
    <linearGradient id="fPop" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff2392"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="fSh"><feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1000" height="150" rx="22" fill="url(#fBg)"/>
  <rect x="3" y="3" width="994" height="144" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="900" cy="20" r="90" fill="#38b6ff" opacity="0.12"/>
  <circle cx="120" cy="150" r="80" fill="#ff2392" opacity="0.12"/>
  <rect x="0" y="0" width="10" height="150" rx="5" fill="url(#fAccent)"/>
  <!-- founder medallion -->
  <g transform="translate(64,32)">
    <circle cx="43" cy="43" r="45" fill="url(#fAccent)"/>
    <circle cx="43" cy="43" r="36" fill="#1b1b2f"/>
    <path d="M43 20 q14 6 14 24 v12 h-28 v-12 q0 -18 14 -24 z" fill="#ffc800"/>
    <rect x="31" y="56" width="24" height="7" rx="3.5" fill="#38b6ff"/>
    <circle cx="43" cy="40" r="6" fill="#1b1b2f"/>
  </g>
  <text x="176" y="58" fill="#ff6b3d" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2">FOUNDER &amp; OWNER</text>
  <text x="174" y="104" fill="url(#fPop)" font-family="Trebuchet MS, Arial, sans-serif" font-size="44" font-weight="bold" filter="url(#fSh)">CRACKYYY.TECH</text>
  <text x="178" y="130" fill="#c9d4e3" font-family="Trebuchet MS, Arial, sans-serif" font-size="18">Founded by Sudalai Manikandan S &#183; Tenkasi, Tamil Nadu, India</text>
  <g transform="translate(815,70)">
    <path d="M0 0 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffc800"/>
  </g>
</svg>
